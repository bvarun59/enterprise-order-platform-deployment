version: "3.9"

services:

  orderservice:

    image: varundocker3/orderservice:${IMAGE_TAG}

    container_name: orderservice

    restart: unless-stopped

    ports:
      - "2007:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2007/health"]
      interval: 30s
      timeout: 5s
      retries: 3